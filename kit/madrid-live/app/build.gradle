plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zaid.madridlive'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zaid.madridlive'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key. Sign your own releases with your key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Test only (never in the APK): plain JVM tests, src/test. org.json is Android's own in the app; the JVM needs
    // the same API to run the parser tests.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
